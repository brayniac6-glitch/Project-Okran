[package]
name = "kenshi-ai"
version = "0.1.0"
description = "Kenshi character AI: perception tags, crimes, targeting (from the sheet's specs)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
kenshi-data = { path = "../data" }

[dev-dependencies]
kenshi-io = { path = "../io" }
kenshi-char = { path = "../char" }
kenshi-world = { path = "../world" }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
