[package]
name = "kenshi-world"
version = "0.1.0"
description = "Kenshi's world: terrain heightmap (and later zones, towns, biomes, weather)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
kenshi-io = { path = "../io" }
kenshi-data = { path = "../data" }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
